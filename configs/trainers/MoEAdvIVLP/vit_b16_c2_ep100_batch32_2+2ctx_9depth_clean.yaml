DATALOADER:
  TRAIN_X:
    BATCH_SIZE: 32
  TEST:
    BATCH_SIZE: 256
  NUM_WORKERS: 16

INPUT:
  SIZE: (224, 224)
  INTERPOLATION: "bicubic"
  PIXEL_MEAN: [0.0, 0.0, 0.0]   # [0.48145466, 0.4578275, 0.40821073]
  PIXEL_STD: [1.0, 1.0, 1.0]    # [0.26862954, 0.26130258, 0.27577711]
  TRANSFORMS: ["random_resized_crop", "random_flip", "normalize"]

OPTIM:
  NAME: "sgd"
  LR: 0.0035
  MAX_EPOCH: 100
  LR_SCHEDULER: "cosine"
  WARMUP_EPOCH: 1
  WARMUP_TYPE: "constant"
  WARMUP_CONS_LR: 1e-5

TRAIN:
  PRINT_FREQ: 20
  CHECKPOINT_FREQ: 20

MODEL:
  BACKBONE:
    NAME: "ViT-B/16"

TRAINER:
  MoEAdvIVLP:
    N_CTX_VISION: 2
    N_CTX_TEXT: 2
    CTX_INIT: "a photo of a"
    PREC: "fp16"
    PROMPT_DEPTH_VISION: 9
    PROMPT_DEPTH_TEXT: 9
    NUM_EXPERTS: 5
    AUX_BALANCE_W: 1e-2
    AUX_DIVERSITY_W: 1e-3
    AUX_BALANCE_W_TARGET: 1e-3
    AUX_DIVERSITY_W_TARGET: 1e-4
    AUX_WARMUP_EPOCHS: 20
    DELTA_SCALE_INIT: 0.1
    TRAIN_TAU: True
    TRAIN_BASE_PROMPT: False
    GATE_MODE: "hybrid"
    GATE_HYBRID_LAMBDA: 0.7
    LR_MULT_GATE: 0.2
    LR_MULT_SCALE: 0.1
    ALPHA_MIN: 0.0
    ALPHA_MAX: 2.0
    TAU_MIN: 0.3
    TAU_MAX: 3.0

AT:
  TRAIN:
    EPS: 1
    ALPHA: 1
    STEPS: 2
    AT_LOSS_TYPE: "clean"

  TEST:
    EPS: 1
    ALPHA: 1
    STEPS: 100
